[package]
name = "haboard"
version = "0.1.1"
authors = ["Yuval Deutscher"]
license = "MPL-2.0"
description = "A cross-platform GPU-accelerated 2D sprite engine"
repository = "https://github.com/hadeutscher/HaBoard"
readme = "../README.md"
keywords = ["gpu", "sprite", "2d"]
edition = "2024"

[features]
default = ["winit"]
# The winit adapter (`WindowEvent` -> `Input`) and the `SceneRunner` application
# shell. On by default so applications need no opt-in; turn it off
# (`default-features = false`) to embed `Engine`/`Scene` in a host that owns its
# own event loop and window, which keeps winit out of the dependency graph
# entirely.
winit = ["dep:winit", "dep:pollster"]
# Bundles the shared demo scene (haboard::demo) used by the example crates.
demo-scene = []

[dependencies]
wgpu = "30"
winit = { version = "0.30", optional = true }
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", features = ["alloc"] }
log = "0.4"

# `SceneRunner` blocks on async GPU init here; the web path uses spawn_local
# instead. Only the runner needs this, hence the tie to the `winit` feature.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { version = "1", optional = true }

# Desktop scene persistence locates a per-user app data directory.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
directories = "6"

# Web: WebGL fallback backend + async executor for non-blocking GPU init, plus
# localStorage (web-sys "Storage") and base64 for scene persistence.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Element",
    "DomRect",
    "HtmlCanvasElement",
    "MouseEvent",
    "PointerEvent",
    "KeyboardEvent",
    "Storage",
] }
base64 = "0.23"
