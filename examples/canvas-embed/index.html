<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>haboard embedded in a canvas</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      header p {
        margin: 0.25rem 0 0;
        max-width: 60ch;
        opacity: 0.75;
        font-size: 0.9rem;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      button {
        font: inherit;
        padding: 0.4rem 0.8rem;
        border-radius: 0.4rem;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* The host owns layout entirely; the backing store is sized in Rust from
         this element's CSS box multiplied by devicePixelRatio. */
      #board {
        width: 100%;
        height: 60vh;
        min-height: 320px;
        border-radius: 0.5rem;
        /* A canvas is inline by default, which leaves a descender gap under it
           and makes the ResizeObserver chase a box that is not the one drawn. */
        display: block;
        touch-action: none;
      }
      #status {
        font-size: 0.85rem;
        opacity: 0.75;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>haboard, embedded</h1>
      <p>
        This page owns its own event loop. haboard is built with
        <code>default-features = false</code>, so there is no winit here at all
        &mdash; the canvas below is handed straight to wgpu, and browser events
        are translated into <code>haboard::Input</code> by this example.
      </p>
    </header>
    <div id="controls">
      <button id="add">Add token</button>
      <button id="rename">Rename selected</button>
      <button id="delete">Delete selected</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="unmount">Unmount canvas</button>
    </div>
    <canvas id="board"></canvas>
    <div id="status"></div>
  </body>
</html>
