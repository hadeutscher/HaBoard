[package]
name = "android-demo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# winit re-exports the matching `AndroidApp`; never depend on android-activity
# directly or the AndroidApp types will mismatch.
winit = { version = "0.30", features = ["android-native-activity"] }
haboard = { path = "../haboard", features = ["demo-scene"] }
log = "0.4"
android_logger = "0.14"

[package.metadata.android]
package = "sh.deut.haboard"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[[package.metadata.android.uses_feature]]
name = "android.hardware.vulkan.level"
required = false
