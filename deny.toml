[licenses]
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "MIT",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Unlicense",
    "WTFPL",
    "Zlib",
]

[advisories]
unmaintained = "workspace"
ignore = [
    # RUSTSEC-2026-0195 and RUSTSEC-2026-0194: unbounded allocation /
    # quadratic run time in quick-xml (<0.41) when parsing attacker-controlled
    # XML. Pulled in transitively, Linux-only, via winit ->
    # smithay-client-toolkit -> wayland-scanner, which uses quick-xml only at
    # wayland-scanner's own build time to parse its bundled, trusted Wayland
    # protocol XML files -- never our code, never runtime, never untrusted
    # input. wayland-scanner 0.31.10 (latest) pins `quick-xml = "0.39"`, so no
    # compatible upgrade exists yet; revisit once wayland-rs releases a
    # version depending on quick-xml >= 0.41.
    "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0194",
]
